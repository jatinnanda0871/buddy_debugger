[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gdb-mcp"
version = "0.1.0"
description = "Drive GDB from an AI agent over GDB/MI, via MCP or as a plain library."
requires-python = ">=3.10"
license = { text = "MIT" }
# mcp 2.0 removed APIs this server and its tests rely on (e.g.
# mcp.shared.memory.create_connected_server_and_client_session), so it's
# excluded. The server handler avoids returning CallToolResult directly
# (see server.py call_tool), which keeps it working across the 1.x range
# rather than only the SDK's newest minor version.
dependencies = ["mcp>=1.10,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
gdb-mcp = "gdb_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gdb_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: drives a real gdb or a real VS Code bridge; skips when absent",
]
