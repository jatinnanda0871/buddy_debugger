[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gdb-mcp"
version = "0.1.0"
description = "Drive GDB from an AI agent over GDB/MI, via MCP or as a plain library."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
gdb-mcp = "gdb_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gdb_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
